name: kalamakum_noor
description: "كلامهم يحيي القلوب — خزانة صوتية متواضعة لأنوار حديثهم الطاهر، نُقدّمها بين أيديكم لاستماع ما يحيي القلوب ويُنير الصدور عليهم السلام"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Audio playback with background support
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.12
  
  # Storage & state
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  uuid: ^4.5.1
  
  # JSON & utilities
  equatable: ^2.0.5
  collection: ^1.18.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf

  assets:
    - assets/fonts/
    - assets/
    - assets/images/
    - assets/books/
    - assets/books/nahj_demo/
    - assets/books/nahj_demo/audio/
    - assets/books/nahj_demo/audio/reader1/
    - assets/books/nahj_demo/audio/reader2/
